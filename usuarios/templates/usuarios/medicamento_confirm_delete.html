{% extends 'base.html' %}

{% block title %}Excluir Medicamento - HealthOn{% endblock %}

{% block content %}
<div class="container py-5">

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
            <h3>Excluir medicamento</h3>

            <p>
                Deseja realmente excluir
                <strong>{{ medicamento.nome }} - {{ medicamento.dosagem }}</strong>?
            </p>

            <form method="post">
                {% csrf_token %}
                <button class="btn btn-danger">Excluir</button>
                <a href="{% url 'medicamento_list' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>

</div>
{% endblock %}
