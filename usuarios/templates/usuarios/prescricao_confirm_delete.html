{% extends 'base.html' %}

{% block content %}
<div class="container py-5">

    <div class="card">
        <div class="card-body">

            <h3>Excluir Prescrição</h3>

            <p>
                Deseja realmente excluir a prescrição
                de <strong>{{ prescricao.medicamento }}</strong>?
            </p>

            <form method="post">
                {% csrf_token %}

                <button class="btn btn-danger">
                    Excluir
                </button>

                <a href="{% url 'prescricao_list' %}"
                   class="btn btn-secondary">
                    Cancelar
                </a>
            </form>

        </div>
    </div>

</div>
{% endblock %}
